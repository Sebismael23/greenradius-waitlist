<!-- CTA Section Component -->
<section class="py-20 bg-gradient-to-r from-emerald-600 to-blue-600 text-white">
  <div class="max-w-4xl mx-auto px-4 text-center">
    <h2 class="text-4xl md:text-5xl font-bold mb-6" id="cta-title">
      Ready to Transform Your Neighborhood?
    </h2>
    <p class="text-xl mb-8 opacity-90" id="cta-subtitle">
      Join the waitlist and be the first to make a real difference in your community
    </p>
    <div class="max-w-md mx-auto">
      <form data-waitlist-form="cta_section" class="flex flex-col sm:flex-row gap-3">
        <input 
          type="email" 
          name="email"
          placeholder="📧 Enter your email" 
          required
          class="flex-1 px-6 py-4 rounded-full text-gray-900 focus:outline-none focus:ring-2 focus:ring-white"
        >
        <button type="submit" class="bg-white text-emerald-600 px-8 py-4 rounded-full text-lg font-semibold hover:bg-gray-100 transition hover:scale-105 whitespace-nowrap">
          Join Waitlist →
        </button>
      </form>
    </div>
    <p class="mt-6 text-sm opacity-75">
      No spam • Early access guaranteed • Be among the first 1,000
    </p>
  </div>
</section>
