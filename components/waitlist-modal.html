<!-- Waitlist Modal Component -->
<div id="waitlist-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div id="modal-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
  
  <!-- Modal Content -->
  <div id="modal-content" class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
    <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl" aria-label="Close modal">
      ✕
    </button>
    
    <div class="p-6">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🌱</div>
        <h3 id="modal-title" class="text-2xl font-bold">Join the Waitlist</h3>
        <p class="text-gray-600">Be one of the first to transform your neighborhood</p>
      </div>
      
      <form id="modal-waitlist-form" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
            <input type="text" id="modal-first-name" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
            <input type="text" id="modal-last-name"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input type="email" id="modal-email" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
            <input type="text" id="modal-city"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
            <select id="modal-state"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
              <option value="">Select...</option>
              <option value="UT">Utah</option>
              <option value="CO">Colorado</option>
              <option value="AZ">Arizona</option>
              <option value="NV">Nevada</option>
              <option value="ID">Idaho</option>
              <option value="WY">Wyoming</option>
              <option value="NM">New Mexico</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Company/Building (Optional)</label>
          <input type="text" id="modal-company" placeholder="e.g., The Aster Apartments"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">What excites you most? (Optional)</label>
          <textarea id="modal-comment" rows="2" placeholder="e.g., I'd love to meet eco-minded neighbors!"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200"></textarea>
        </div>
        
        <button type="submit" 
                class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
          Join the Waitlist 🚀
        </button>
        
        <p class="text-xs text-center text-gray-500">
          We respect your privacy. No spam, ever.
        </p>
      </form>
      
      <div id="modal-form-message" class="hidden"></div>
    </div>
  </div>
</div>
