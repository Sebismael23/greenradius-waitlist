<!-- Waitlist Modal -->
<div id="waitlist-modal"
  class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center hidden overflow-y-auto p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-lg w-full relative my-8">
    <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl">×</button>
    <h2 id="modal-title" class="text-2xl font-bold mb-4 text-center">Join the Waitlist</h2>
    <form id="modal-waitlist-form" class="space-y-4">
      <input type="email" name="email_address" id="modal-email" placeholder="📧 Email" required
        class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
      <input type="text" name="city" id="modal-city" placeholder="🏙️ City (optional)"
        class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
      <button type="submit"
        class="w-full bg-emerald-600 text-white py-3 rounded-full font-semibold hover:bg-emerald-700 transition hover:scale-105">Submit</button>
      <div id="modal-form-message" class="hidden"></div>
    </form>
  </div>
</div>
