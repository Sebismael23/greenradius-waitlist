<!-- Waitlist Modal -->
<div id="waitlist-modal"
  class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center hidden overflow-y-auto p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-lg w-full relative my-8">
    <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl">×</button>
    <h2 id="modal-title" class="text-2xl font-bold mb-4 text-center">Join the Waitlist</h2>
    <form id="modal-waitlist-form" class="space-y-4">
      <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
        <input type="text" name="first_name" id="modal-first-name" placeholder="First Name" required
          class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
        <input type="text" name="last_name" id="modal-last-name" placeholder="Last Name" required
          class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
      </div>
      <input type="email" name="email_address" id="modal-email" placeholder="Email" required
        class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
      <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
        <input type="text" name="city" id="modal-city" placeholder="City" required
          class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
        <input type="text" name="state" id="modal-state" placeholder="State" required
          class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
      </div>
      <input type="text" name="company" id="modal-company" placeholder="Company (optional)"
        class="w-full px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:border-emerald-500">
      <textarea name="comment" id="modal-comment" placeholder="What are you excited about, want, or any concerns?"
        rows="3"
        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-emerald-500"></textarea>
      <button type="submit"
        class="w-full bg-emerald-600 text-white py-3 rounded-full font-semibold hover:bg-emerald-700 transition hover:scale-105">Submit</button>
      <div id="modal-form-message" class="hidden"></div>
    </form>
  </div>
</div>
